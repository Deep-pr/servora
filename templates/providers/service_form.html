{% extends 'base.html' %}
{% block title %}{{ title }} | Servora{% endblock %}
{% block content %}
<section class="page-header"><div class="container"><h1>{{ title }}</h1><p>Keep pricing and service descriptions clear for customers.</p></div></section>
<section class="section-band">
  <div class="container">
    <div class="profile-shell">
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary">Save Service</button>
        <a class="btn btn-outline-secondary" href="{% url 'providers:my_services' %}">Cancel</a>
      </form>
    </div>
  </div>
</section>
{% endblock %}
