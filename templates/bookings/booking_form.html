{% extends 'base.html' %}
{% block title %}Book {{ provider.business_name }} | Servora{% endblock %}
{% block content %}
<section class="page-header"><div class="container"><h1>Book {{ provider.business_name }}</h1><p>Send a booking request with your preferred date, address, and problem details.</p></div></section>
<section class="section-band"><div class="container">
  <div class="profile-shell">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary">Send Booking Request</button>
      <a class="btn btn-outline-secondary" href="{% url 'providers:profile' provider.pk %}">Cancel</a>
    </form>
  </div>
</div></section>
{% endblock %}
