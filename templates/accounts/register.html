{% extends 'base.html' %}
{% block title %}{{ title|default:'Register' }} | Servora{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <h1>{{ title|default:'Create Account' }}</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary w-100">Register</button>
    </form>
  </div>
</section>
{% endblock %}
