{% extends 'base.html' %}
{% block title %}My Profile | Servora{% endblock %}
{% block content %}
<section class="page-header"><div class="container"><h1>My Profile</h1><p>Keep your contact and service location details updated.</p></div></section>
<section class="section-band">
  <div class="container">
    <div class="profile-shell">
      <form method="post">
        {% csrf_token %}
        <h2>Account Details</h2>
        {{ user_form.as_p }}
        <h2 class="mt-4">Customer Details</h2>
        {{ role_form.as_p }}
        <button class="btn btn-primary">Save Profile</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
